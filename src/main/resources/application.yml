server:
  port: 8090

jwt:
  secret: ${JWT_SECRET:eventmaster-shared-dev-secret-key-change-in-prod}

services:
  user-service:
    url: http://localhost:8080
  event-service:
    url: http://localhost:8081
  recommendation-service:
    url: http://localhost:8082
  feed-service:
    url: http://localhost:8083

spring:
  application:
    name: api-gateway
  redis:
    host: localhost
    port: 6379
  sleuth:
    sampler:
      probability: 1.0
  zipkin:
    enabled: false
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns: "${CORS_ALLOWED_ORIGINS:http://localhost:5173}"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    urls:
      - name: user-service
        url: /v3/api-docs/user-service
      - name: event-service
        url: /v3/api-docs/event-service
      - name: recommendation-service
        url: /v3/api-docs/recommendation-service
      - name: feed-service
        url: /v3/api-docs/feed-service

logging:
  level:
    root: INFO
    com.eventmaster: DEBUG
    org.springframework.cloud.gateway: DEBUG
